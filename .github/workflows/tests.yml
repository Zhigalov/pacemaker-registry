name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pacers_test
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d pacers_test"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://registry:test-only-password@127.0.0.1:5432/pacers_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.lock'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install --no-deps -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Python, PostgreSQL and chart parity tests
        run: python -m pytest -q
      - name: Browser analytics tests
        run: node --test tests/analytics.test.cjs
      - name: Verify distributable assets
        run: |
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir /tmp/pacers-wheel .
          python -c "import glob, zipfile; names=zipfile.ZipFile(glob.glob('/tmp/pacers-wheel/*.whl')[0]).namelist(); assert 'pacemaker_registry/migrations/0001_baseline.sql' in names; assert 'pacemaker_registry/static/rating-models.js' in names"
