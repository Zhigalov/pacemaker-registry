<div class="event-chart-wrap">
  <svg class="event-chart" viewBox="0 0 800 320" role="img" aria-label="Оценка за темп: абсолютное отклонение в секундах на километр" tabindex="0" data-pace-chart>
    <g data-zones></g><g class="event-chart-grid" data-grid></g><g data-curves></g><g data-handles></g>
    <g data-hover hidden><line y1="26" y2="258"></line><circle r="5"></circle></g>
  </svg>
  <output class="event-chart-readout" data-readout aria-live="polite">Наведите на график, чтобы увидеть оценку</output>
  <p class="event-note">Шкала симметрична: ±10 с/км означает на 10 секунд быстрее или медленнее цели.{% if pace_editable %} Тяните круглые точки влево и вправо для изменения границ, вверх и вниз — для баллов. Квадрат меняет резкость экспоненты.{% endif %}</p>
  <noscript><p>Для просмотра графика включите JavaScript.</p></noscript>
</div>
